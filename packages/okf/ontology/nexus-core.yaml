    parents: []
    required: [id, type]
  AgentRole:
    parents: [Concept]
    required: [id, title]
  Tool:
    parents: [Concept]
    required: [id, title]
  Policy:
    parents: [Concept]
    required: [id, title]
  Playbook:
    parents: [Concept]
    required: [id, title]
  Metric:
    parents: [Concept]
    required: [id, title]
  Domain:
    parents: [Concept]
    required: [id, title]
predicates:
