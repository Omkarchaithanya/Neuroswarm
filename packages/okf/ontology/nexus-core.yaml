    range: Concept
  extends:
    domain: Concept
    range: Concept
  aliases:
    domain: Concept
    range: Concept
  owns:
    domain: Concept
    range: Concept
  see_also:
    domain: Concept
    range: Concept
type_map:
  agent: AgentRole
  tool: Tool
  policy: Policy
  playbook: Playbook
  metric: Metric
  domain: Domain
  concept: Concept
  ontology: Concept
