[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-okf"
version = "1.0.0"
description = "NEXUS OKF Knowledge Operating System"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "orjson>=3.11",
  "typer>=0.16",
  "fastapi>=0.115",
  "pydantic>=2.11",
  "prometheus-client>=0.22",
]

[project.scripts]
okf = "nexus_okf.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_okf*"]

[tool.setuptools.package-data]
"nexus_okf" = ["py.typed"]
