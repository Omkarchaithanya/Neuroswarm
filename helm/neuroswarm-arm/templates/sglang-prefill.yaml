{{- if .Values.sglangPrefill.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-prefill
  labels:
    {{- include "neuroswarm-arm.labels" . | nindent 4 }}
    app: sglang-prefill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-prefill
  template:
    metadata:
      labels:
        app: sglang-prefill
    spec:
      containers:
        - name: sglang
          image: "{{ .Values.sglangPrefill.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.sglangPrefill.port }}
          env:
            - name: SGLANG_USE_CPU_ENGINE
              value: "{{ .Values.sglangPrefill.env.SGLANG_USE_CPU_ENGINE }}"
          args:
            - python
            - -m
            - sglang.launch_server
            - --model-path
            - "{{ .Values.sglangPrefill.model }}"
            - --device
            - cpu
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.sglangPrefill.port }}"
            - --chunked-prefill-size
            - "{{ .Values.env.NSA_DIPA_CHUNK_SIZE }}"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.sglangPrefill.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-prefill
  labels:
    {{- include "neuroswarm-arm.labels" . | nindent 4 }}
spec:
  selector:
    app: sglang-prefill
  ports:
    - name: http
      port: {{ .Values.sglangPrefill.port }}
      targetPort: http
{{- end }}
