apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuroswarm-arm
  labels:
    app: neuroswarm-arm
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: neuroswarm-arm
  template:
    metadata:
      labels:
        app: neuroswarm-arm
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: gateway
          image: "{{ .Values.image.gateway }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          env:
            - name: NSA_REQUIRE_KLEIDIAI
              value: "{{ .Values.env.NSA_REQUIRE_KLEIDIAI }}"
            - name: NSA_DIPA_KLEIDIAI
              value: "{{ .Values.env.NSA_DIPA_KLEIDIAI }}"
            - name: NSA_DIPA_OTEL
              value: "{{ .Values.env.NSA_DIPA_OTEL }}"
            - name: NSA_DIPA_PD_MODE
              value: "{{ .Values.env.NSA_DIPA_PD_MODE }}"
            - name: NSA_DIPA_PREFILL_BACKEND
              value: "{{ .Values.env.NSA_DIPA_PREFILL_BACKEND }}"
            - name: NSA_DIPA_DECODE_BACKEND
              value: "{{ .Values.env.NSA_DIPA_DECODE_BACKEND }}"
            - name: NSA_DIPA_SGLANG_URL
              value: "{{ .Values.env.NSA_DIPA_SGLANG_URL }}"
            - name: NSA_DIPA_CHUNK_SIZE
              value: "{{ .Values.env.NSA_DIPA_CHUNK_SIZE }}"
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
