{{- range $name, $_ := .Values.tiers }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "neuroswarm-arm.labels" $ | nindent 4 }}
    app: {{ $name }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
