id: github.list_pull_requests
name: GitHub List Pull Requests
description: List pull requests for a repository filtered by state.
namespace: github
category: github
tags:
- github
- mcp
params:
  repo: owner/name
  state: open|closed|all
  limit: max PRs
example_prompts:
- list pull requests
- open PRs
capabilities:
- github
- mcp
endpoint: mcp://github/list_pull_requests
input_schema:
  type: object
  properties:
    repo:
      type: string
      description: owner/name
    state:
      type: string
      description: open|closed|all
    limit:
      type: string
      description: max PRs
output_schema:
  type: object
