id: web.search
name: Web Search
description: Search the public web and return ranked results.
namespace: web-search
category: web-search
tags:
- web-search
- mcp
params:
  query: search query
  limit: max results
example_prompts:
- search the web
- google-like search
- search the web for Arm Neoverse V2
- look up a related web source before answering
- search public docs online
capabilities:
- web-search
- mcp
endpoint: mcp://web-search/search
input_schema:
  type: object
  properties:
    query:
      type: string
      description: search query
    limit:
      type: string
      description: max results
output_schema:
  type: object
