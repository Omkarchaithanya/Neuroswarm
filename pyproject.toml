[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroswarm_arm*"]

[tool.setuptools.package-data]
"neuroswarm_arm.runtime.dipa" = ["config/*.yaml"]

[tool.uv.workspace]
members = [
    "packages/okf",
]

[tool.uv.sources]
nexus-okf = { workspace = true, editable = true }

[project]
name = "nexus-arm"
version = "0.1.0"
description = "NEXUS-ARM: Unified Agentic Runtime for ARM CPUs"
requires-python = ">=3.11"

dependencies = [
    # ==========================================
    # Core API
    # ==========================================
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "starlette>=0.47",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    # ==========================================
    # Async
    # ==========================================
    "anyio>=4.10",
    "httpx>=0.28",
    "aiofiles>=24.1",
    "tenacity>=9.1",
    # ==========================================
    # LLM Providers
    # ==========================================
    "openai>=1.97",
    "anthropic>=0.60",
    "google-genai>=1.28",
    # ==========================================
    # HuggingFace
    # ==========================================
    "transformers>=4.54",
    "tokenizers>=0.21",
    "accelerate>=1.9",
    "sentencepiece>=0.2",
    # ==========================================
    # Embeddings
    # ==========================================
    "sentence-transformers>=5.0",
    # ==========================================
    # TurboVec
    # ==========================================
    "turbovec",
    # ==========================================
    # Memory / KV Runtime
    # ==========================================
    "mem0ai",
    "redis>=6",
    "networkx>=3.5",
    "lmdb>=1.6",
    "zstandard>=0.23",
    "lz4>=4.3",
    "psutil>=6.1",
    # ==========================================
    # MCP
    # ==========================================
    "mcp>=1.12",
    # ==========================================
    # LangGraph Ecosystem
    # ==========================================
    "langchain>=0.3",
    "langgraph>=0.5",
    "langsmith>=0.4",
    # ==========================================
    # Scheduling
    # ==========================================
    "apscheduler>=3.11",
    # ==========================================
    # Observability
    # ==========================================
    "opentelemetry-api>=1.36",
    "opentelemetry-sdk>=1.36",
    "opentelemetry-exporter-otlp>=1.36",
    "prometheus-client>=0.22",
    # ==========================================
    # Dashboard
    # ==========================================
    "streamlit>=1.47",
    # ==========================================
    # Data Science
    # ==========================================
    "numpy>=2.3",
    "scipy>=1.16",
    "pandas>=2.3",
    # ==========================================
    # Configuration
    # ==========================================
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "tomli>=2.2",
    # ==========================================
    # Serialization
    # ==========================================
    "orjson>=3.11",
    # ==========================================
    # Utilities
    # ==========================================
    "rich>=14",
    "typer>=0.16",
    "loguru>=0.7",
    "onnxruntime>=1.22",
    "nexus-okf",
]

[project.optional-dependencies]
# Slim runtime for Dockerfile.arm64 / gateway container (no HF / LangGraph / ML stack).
gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "starlette>=0.47",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "anyio>=4.10",
    "httpx>=0.28",
    "aiofiles>=24.1",
    "tenacity>=9.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.1",
    "orjson>=3.11",
    "numpy>=2.3",
    "zstandard>=0.23",
    "lz4>=4.3",
    "psutil>=6.1",
    "blake3>=1.0",
    "fastembed>=0.8.0",
    "onnxruntime>=1.17.0",
    "turbovec>=0.8.0",
    "mcp>=1.12",
    "opentelemetry-api>=1.36",
    "opentelemetry-sdk>=1.36",
    "opentelemetry-exporter-otlp>=1.36",
    "prometheus-client>=0.22",
    "rich>=14",
    "typer>=0.16",
    "loguru>=0.7",
]
# Apple Silicon (M3/M4/M5) native Metal inference via mlx-lm.
apple = [
    "mlx-lm>=0.21",
]

[dependency-groups]
gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "starlette>=0.47",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "anyio>=4.10",
    "httpx>=0.28",
    "aiofiles>=24.1",
    "tenacity>=9.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.1",
    "orjson>=3.11",
    "numpy>=2.3",
    "zstandard>=0.23",
    "lz4>=4.3",
    "psutil>=6.1",
    "blake3>=1.0",
    "fastembed>=0.8.0",
    "onnxruntime>=1.17.0",
    "turbovec>=0.8.0",
    "mcp>=1.12",
    "opentelemetry-api>=1.36",
    "opentelemetry-sdk>=1.36",
    "opentelemetry-exporter-otlp>=1.36",
    "prometheus-client>=0.22",
    "rich>=14",
    "typer>=0.16",
    "loguru>=0.7",
]
agent = [
    "langchain>=0.3",
    "langgraph>=0.5",
    "langsmith>=0.4",
]
ai = [
    "onnxruntime>=1.22",
    "sentence-transformers>=5.0",
    "tokenizers>=0.21",
    "turbovec>=0.8.0",
]
ann = [
    "faiss-cpu>=1.8.0",
    "hnswlib>=0.8",
    "usearch>=2.16",
]
async-extra = [
    "aiofiles>=24.1",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "tenacity>=9.1",
]
bench = [
    "matplotlib>=3.9",
]
cli-utils = [
    "loguru>=0.7",
    "python-dotenv>=1.1",
    "rich>=14",
]
dashboard = [
    "streamlit>=1.47",
]
data = [
    "duckdb>=1.1",
    "msgpack>=1.1",
    "pandas>=2.3",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
]

dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "black>=25.1",
    "ipykernel>=6.30",
]
apple = [
    "mlx-lm>=0.21",
]
evolution = [
    "gepa>=0.1.3",
]
hf = [
    "accelerate>=1.9",
    "sentencepiece>=0.2",
    "transformers>=4.54",
]
llm = [
    "anthropic>=0.60",
    "google-genai>=1.28",
    "openai>=1.97",
]
mcp = [
    "mcp>=1.12",
]
memory = [
    "lmdb>=1.6",
    "lz4>=4.3",
    "mem0ai>=2.0.12",
    "networkx>=3.5",
    "redis>=6",
    "zstandard>=0.23",
]
nlp = [
    "fastembed>=0.8.0",
    "mem0ai[nlp]>=2.0.12",
]
okf = [
    "cryptography>=43",
    "tree-sitter-markdown>=0.5.1",
]
optional = [
    "blake3>=1.0",
]
research = [
    "scipy>=1.16",
]
telemetry = [
    "opentelemetry-api>=1.36",
    "opentelemetry-exporter-otlp>=1.36",
    "opentelemetry-sdk>=1.36",
]

[tool.neuroswarm.env_defaults]
NSA_LLAMA_SLOT_DIR = "/tmp/neuroswarm-slots"
NSA_LLAMA_SLOT_KV_REUSE = "1"

