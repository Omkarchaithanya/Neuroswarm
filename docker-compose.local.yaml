# Local amd64 override (Windows / Intel dev hosts).
# Usage: docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d tier1 tier2 tier3 gateway
#
# Docker Desktop memory: set Resources → Memory to >= 16 GiB for all three tiers.
# If tier3 restarts while loading, stop tier2 first or raise Docker memory.
services:
  gateway:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: neuroswarm-arm-gateway:local
    deploy: !reset null
    mem_limit: 512m

  tier1:
    platform: linux/amd64
    build: !reset null
    image: ghcr.io/ggml-org/llama.cpp:server
    deploy: !reset null
    cpus: 2
    mem_limit: 512m
    healthcheck:
      start_period: 120s
      interval: 15s
      timeout: 10s
      retries: 20

  tier2:
    platform: linux/amd64
    build: !reset null
    image: ghcr.io/ggml-org/llama.cpp:server
    deploy: !reset null
    cpus: 2
    mem_limit: 1800m
    healthcheck:
      start_period: 600s
      interval: 20s
      timeout: 10s
      retries: 30

  tier-spec:
    platform: linux/amd64
    build: !reset null
    image: ghcr.io/ggml-org/llama.cpp:server
    deploy: !reset null
    cpus: 2
    mem_limit: 1024m
    healthcheck:
      start_period: 180s
      interval: 15s
      timeout: 10s
      retries: 20

  tier3:
    platform: linux/amd64
    build: !reset null
    image: ghcr.io/ggml-org/llama.cpp:server
    deploy: !reset null
    cpus: 4
    mem_limit: 4.5g
    command:
      - -m
      - /models/DeepSeek-R1-Distill-Qwen-7B-Q4_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "0"
      - -t
      - "${TIER3_THREADS:-8}"
      - -c
      - "${TIER3_CTX:-1024}"
      - --parallel
      - "${TIER3_PARALLEL:-1}"
      - --jinja
      - --reasoning-budget
      - "0"
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --slot-save-path
      - /var/lib/ns/slots
      - --metrics
    healthcheck:
      start_period: 900s
      interval: 30s
      timeout: 15s
      retries: 40

  prometheus:
    profiles: ["monitoring"]

  grafana:
    profiles: ["monitoring"]
