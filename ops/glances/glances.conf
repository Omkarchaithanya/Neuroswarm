# Glances config for NeuroSwarm Axion hostmon profile.
# Prometheus exporter must bind 0.0.0.0 so obs can scrape via VPC.
# Used by the `glances` service (-q --export prometheus), not glances-web.

[global]
check_update=false
refresh=2

[prometheus]
host=0.0.0.0
port=9091
prefix=glances
labels=src:glances,host:axion

[raid]
disable=true

[folders]
disable=true

[sensors]
disable=true

[wifi]
disable=true

[irq]
disable=true
