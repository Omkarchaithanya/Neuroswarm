# OpenTelemetry Collector on neuroswarm-axion
# OTLP for traces (+ optional app metrics). Gateway Prometheus metrics are
# scraped once by neuroswarm-obs (10.128.0.2:80) — do NOT scrape gateway here
# or obs will ingest the same series via remote_write + direct scrape.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  resource:
    attributes:
      - key: deployment.environment
        value: axion
        action: upsert
      - key: service.namespace
        value: neuroswarm
        action: upsert

exporters:
  # Optional: non-gateway OTLP metrics only. Gateway /metrics stay on obs scrape.
  prometheusremotewrite:
    endpoint: ${env:OBS_PROMETHEUS_REMOTE_WRITE}
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheusremotewrite]
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [debug]
