# neuroswarm-obs — public :80 → Prometheus + Grafana (basic auth required)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream prometheus_upstream {
    server prometheus:9090;
}

upstream grafana_upstream {
    server grafana:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    # Unauthenticated liveness for compose healthchecks only.
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Lock down both UIs — do not expose bare /prometheus or /grafana.
    location /prometheus/ {
        auth_basic "Neuroswarm Observability";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://prometheus_upstream;
    }

    location /grafana/ {
        auth_basic "Neuroswarm Observability";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://grafana_upstream;
    }

    location = / {
        return 302 /grafana/;
    }
}
