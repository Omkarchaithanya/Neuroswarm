# Axion app VM — API only (:80). Prometheus/Grafana live on neuroswarm-obs.
# Use Docker embedded DNS so upstream tracks gateway IP after recreate.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # Compose default bridge DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /grafana {
        return 302 $scheme://$host/grafana/;
    }
    location /grafana/ {
        default_type text/plain;
        return 200 'Grafana moved to the neuroswarm-obs host (/grafana/).\n';
    }

    location = /prometheus {
        return 302 $scheme://$host/prometheus/;
    }
    location /prometheus/ {
        default_type text/plain;
        return 200 'Prometheus moved to the neuroswarm-obs host (/prometheus/).\n';
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $gateway_upstream gateway:8000;
        proxy_pass http://$gateway_upstream;
    }
}
