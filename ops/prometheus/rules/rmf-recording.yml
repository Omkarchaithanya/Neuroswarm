groups:
- name: nexus_rmf_latency
  interval: 30s
  rules:
  - record: nexus:request_duration_seconds:avg5m
    expr: sum(rate(nexus_request_duration_seconds_sum[5m])) / clamp_min(sum(rate(nexus_request_duration_seconds_count[5m])),
      1)
  - record: nexus:request_duration_seconds:p95_5m
    expr: histogram_quantile(0.95, sum(rate(nexus_request_duration_seconds_bucket[5m]))
      by (le))
  - record: nexus:request_duration_seconds:p99_5m
    expr: histogram_quantile(0.99, sum(rate(nexus_request_duration_seconds_bucket[5m]))
      by (le))
  - record: nexus:planner_latency_seconds:avg5m
    expr: sum(rate(nexus_planner_latency_seconds_sum[5m])) / clamp_min(sum(rate(nexus_planner_latency_seconds_count[5m])),
      1)
  - record: nexus:dipa_prefill_latency_seconds:p95_5m
    expr: histogram_quantile(0.95, sum(rate(nexus_dipa_prefill_latency_seconds_bucket[5m]))
      by (le))
- name: nexus_rmf_efficiency
  interval: 30s
  rules:
  - record: nexus:cost_per_request:avg5m
    expr: avg_over_time(nexus_cost_per_request[5m])
  - record: nexus:cpu_usage:avg5m
    expr: avg_over_time(nexus_hw_cpu_usage[5m])
  - record: nexus:memory_rss_bytes:avg5m
    expr: avg_over_time(nexus_memory_rss_bytes[5m])
  - record: nexus:kv_cache_reuse:avg5m
    expr: avg_over_time(nexus_kv_cache_reuse[5m])
  - record: nexus:planner_accuracy:avg5m
    expr: 1 - clamp_max(avg_over_time(nexus_planner_prediction_error[5m]), 1)
  - record: nexus:backend_efficiency:ratio5m
    expr: sum(rate(nexus_routing_backend_usage_total{status="ok"}[5m])) / clamp_min(sum(rate(nexus_routing_backend_usage_total[5m])),
      1)
  - record: nexus:quantization_efficiency:ratio5m
    expr: sum(rate(nexus_routing_quantization_usage_total{status="ok"}[5m])) / clamp_min(sum(rate(nexus_routing_quantization_usage_total[5m])),
      1)
