global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/rmf-alerts.yml
  - /etc/prometheus/rules/rmf-recording.yml

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - localhost:9090

  # Canonical Compose gateway via nginx on axion (:80 /metrics).
  # Do NOT also scrape :8889 or k3s NodePort — that duplicates series ×2–3.
  - job_name: neuroswarm-gateway
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.128.0.2:80
        labels:
          service: neuroswarm-gateway
          host: axion
          runtime: compose
