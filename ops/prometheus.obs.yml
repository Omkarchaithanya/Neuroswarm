global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/rmf-alerts.yml
  - /etc/prometheus/rules/rmf-recording.yml

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets:
          - localhost:9090

  # Compose nginx path on axion (:80 /metrics)
  - job_name: neuroswarm-gateway
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.128.0.2:80
        labels:
          service: neuroswarm-gateway
          host: axion
          runtime: compose

  # k3s Helm NodePort (sync-and-deploy -Mode k8s); one of compose/k8s will be UP
  - job_name: neuroswarm-gateway-k8s
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.128.0.2:30080
        labels:
          service: neuroswarm-gateway
          host: axion
          runtime: k8s

  # OTEL collector prometheusexporter on axion
  - job_name: axion-otel-exporter
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - 10.128.0.2:8889
        labels:
          service: otel-collector
          host: axion
